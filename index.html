<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#765033" />
    <title>وقتي | يومك حول الصلاة</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="categories.css" />
    <link rel="stylesheet" href="follow-up.css" />
    <link rel="stylesheet" href="heart-reminder.css" />
  </head>
  <body>
    <aside>
      <a class="brand" href="#">
        ◷
        <b>وقتي</b>
      </a>
      <p>مساحة ليوم أكثر اتزانًا</p>
      <nav aria-label="التنقل الرئيسي">
        <button data-view="day" class="active">
          <svg
            class="ui-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            focusable="false"
          >
            <rect x="4" y="4" width="16" height="16" rx="3" />
            <path d="M4 10h16M10 10v10" />
          </svg>
          يومي
        </button>
        <button data-view="dashboard">
          <svg
            class="ui-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            focusable="false"
          >
            <path d="m5 7 2 2 3-4M13 7h6M5 14h14M5 19h14" />
          </svg>
          لوحة المهام
        </button>
        <button data-view="followUp">مرجع المتابعة</button>
        <button data-view="projects">
          <svg
            class="ui-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            focusable="false"
          >
            <path d="M3 7V5h7l2 3h9v12H3z" />
          </svg>
          المشاريع
        </button>
        <button data-view="actions">
          <svg
            class="ui-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            focusable="false"
          >
            <rect x="4" y="4" width="6" height="6" rx="1" />
            <rect x="14" y="4" width="6" height="6" rx="1" />
            <rect x="4" y="14" width="6" height="6" rx="1" />
            <rect x="14" y="14" width="6" height="6" rx="1" />
          </svg>
          الأقسام والأفعال
        </button>
        <button data-view="repeat">
          <svg
            class="ui-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            focusable="false"
          >
            <path d="M18 8a7 7 0 1 0 1 8M18 3v5h-5" />
          </svg>
          مهامي المتكررة
        </button>
        <button data-view="settings">
          <svg
            class="ui-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            focusable="false"
          >
            <path d="M4 7h16M4 17h16" />
            <circle cx="9" cy="7" r="3" />
            <circle cx="15" cy="17" r="3" />
          </svg>
          إعدادات الصلاة
        </button>
      </nav>
      <div class="aside-foot">
        خطوة صغيرة، وأثر مستمر.
        <br />
        <span>كل عشر دقائق فرصة جديدة</span>
      </div>
    </aside>
    <nav class="mobile-navigation" aria-label="التنقل على الهاتف">
      <button data-view="day" class="active">
        <svg
          class="ui-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
          focusable="false"
        >
          <rect x="4" y="4" width="16" height="16" rx="3" />
          <path d="M4 10h16M10 10v10" />
        </svg>
        يومي
      </button>
      <button data-view="dashboard">
        <svg
          class="ui-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
          focusable="false"
        >
          <path d="m5 7 2 2 3-4M13 7h6M5 14h14M5 19h14" />
        </svg>
        لوحة المهام
      </button>
      <button data-view="projects">
        <svg
          class="ui-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
          focusable="false"
        >
          <path d="M3 7V5h7l2 3h9v12H3z" />
        </svg>
        المشاريع
      </button>
      <details id="navigationMore">
        <summary>
          <svg
            class="ui-icon"
            viewBox="0 0 24 24"
            fill="currentColor"
            aria-hidden="true"
          >
            <circle cx="5" cy="12" r="2" />
            <circle cx="12" cy="12" r="2" />
            <circle cx="19" cy="12" r="2" />
          </svg>
          المزيد
        </summary>
        <div class="mobile-more-items">
          <button data-view="followUp">مرجع المتابعة</button>
          <button data-view="actions">
            <svg
              class="ui-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <rect x="4" y="4" width="6" height="6" rx="1" />
              <rect x="14" y="4" width="6" height="6" rx="1" />
              <rect x="4" y="14" width="6" height="6" rx="1" />
              <rect x="14" y="14" width="6" height="6" rx="1" />
            </svg>
            الأقسام والأفعال
          </button>
          <button data-view="repeat">
            <svg
              class="ui-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <path d="M18 8a7 7 0 1 0 1 8M18 3v5h-5" />
            </svg>
            مهامي المتكررة
          </button>
          <button data-view="settings">
            <svg
              class="ui-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <path d="M4 7h16M4 17h16" />
              <circle cx="9" cy="7" r="3" />
              <circle cx="15" cy="17" r="3" />
            </svg>
            إعدادات الصلاة
          </button>
        </div>
      </details>
    </nav>
    <main>
      <header>
        <span>يومك، بنية وترتيب</span>
        <div class="sync-header">
          <button
            id="downloadBackup"
            class="secondary backup-download"
            type="button"
            title="تنزيل نسخة احتياطية من بيانات التطبيق"
            aria-label="تنزيل نسخة احتياطية من بيانات التطبيق"
          >
            ↓ تنزيل نسخة
          </button>
          <button id="accountButton" class="secondary">
            دخول / إنشاء حساب
          </button>
          <span class="save" id="syncStatus" role="status">
            ● محفوظ على هذا الجهاز
          </span>
        </div>
      </header>
      <section id="app"></section>
      <footer>وقتي · رتّب وقتك حول ما يهمك</footer>
    </main>
    <dialog id="picker">
      <div class="dialog-head">
        <h2 id="pickTitle"></h2>
        <button id="close" aria-label="إغلاق">×</button>
      </div>
      <p>ماذا ستفعل في هذا الوقت؟</p>
      <div id="choices"></div>
      <button id="clearSlot" class="secondary full">إفراغ الخانة</button>
    </dialog>
    <dialog id="prayerDialog" aria-labelledby="prayerTitle">
      <div class="dialog-head">
        <h2 id="prayerTitle"></h2>
        <button id="closePrayer" aria-label="إغلاق مهام الصلاة">×</button>
      </div>
      <p>
        إنجازك لهذه الصلاة
        <strong id="prayerProgress" dir="ltr"></strong>
      </p>
      <div id="prayerChecks"></div>
      <form method="dialog">
        <button class="primary full" style="margin-top:20px">تم</button>
      </form>
    </dialog>
    <dialog id="taskEditor" aria-labelledby="taskEditTitle">
      <h2 id="taskEditTitle">تعديل المهمة</h2>
      <form id="taskEditForm">
        <label class="field">
          المهمة
          <input id="taskEditName" required maxlength="150" />
        </label>
        <label class="field" id="taskEditPrayerField">
          الصلاة
          <select id="taskEditPrayer"></select>
        </label>
        <p id="taskEditHint" class="hint"></p>
        <button class="primary">حفظ التعديل</button>
        <button type="button" class="secondary" id="cancelTaskEdit">
          إلغاء
        </button>
      </form>
    </dialog>
    <dialog id="reminderDialog" aria-labelledby="heartTitle" aria-describedby="heartSubtitle" dir="rtl" lang="ar">
      <header class="heart-header">
        <div class="heart-topbar">
          <span class="heart-brand">تذكير القلب</span>
          <button type="button" id="heartBack" hidden>رجوع</button>
          <button type="button" id="acknowledgeReminder" aria-label="إغلاق تذكير القلب" autofocus>إغلاق ×</button>
        </div>
        <h2 id="heartTitle" tabindex="-1">ماذا يحتاج قلبك الآن؟</h2>
        <p id="heartSubtitle">اختر ما يعينك على ذكر الله والعمل بما يرضيه</p>
      </header>
      <div id="heartBody"></div>
      <footer class="heart-bottom"><div id="heartFooter"></div></footer>
      <p id="heartStatus" role="status" aria-live="polite"></p>
    </dialog>
    <div id="toast" role="status"></div>
    <script src="vendor/adhan.js"></script>
    <script src="calendar.js"></script>
    <script src="categories.js"></script>
    <script src="slots.js"></script>
    <script src="task-engine.js"></script>
    <script src="dashboard.js"></script>
    <script src="projects.js"></script>
    <script src="tafsir-default.js"></script>
    <script src="follow-up.js"></script>
    <script src="heart-reminder-data.js"></script>
    <script src="heart-reminder.js?v=2"></script>
    <script src="app.js"></script>
    <script src="vendor/firebase-app-compat.js"></script>
    <script src="vendor/firebase-auth-compat.js"></script>
    <script src="vendor/firebase-database-compat.js"></script>
    <script src="sync-merge.js"></script>
    <script src="sync.js"></script>
  </body>
</html>
